params:
  - id: admin_password
    type: secret
    name: "Admin Password"
    description: "Admin password for first-run bootstrap (only used when database has no users)"
    default_value: "$random(len=16)"

locales:
  zh:
    admin_password:
      name: "管理员密码"
      description: "管理员初始密码（首次启动引导用，仅在数据库无用户时生效；至少 12 位，不能包含 $）"
