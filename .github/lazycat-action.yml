version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/codex-proxy-rs.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: codex-proxy-rs

build:
  run_buildscript: false

images:
  # 版本源镜像：上游 ghcr 纯 SemVer tag（不带 v 前缀），随 v3.x 家族自动更新
  - id: codex-proxy-rs
    target: service
    service: codex-proxy-rs
    source: ghcr.io/zyycn/codex-proxy-rs
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
    create_if_missing: true
    application:
      language: zh
      name: Codex Proxy RS
      brief: 面向 Codex 的自托管多账号 AI 网关
      description: |
        自托管多账号 AI 网关：集中管理 OpenAI / xAI 账号与密钥，统一调度配额与
        并发，为 Codex CLI / 桌面端提供 Responses API 代理。支持账号分组、
        客户端密钥、用量统计与健康时间线。
      keywords: codex, ai, gateway, proxy, responses, openai, xai
      source: https://github.com/zyycn/codex-proxy-rs
      source_author: zyycn
      support_pc: true
      screenshot_pc_files:
        - .github/screenshots/pc-1-dashboard.png
        - .github/screenshots/pc-2-accounts.png
        - .github/screenshots/pc-3-keys.png
        - .github/screenshots/pc-4-settings.png
  private:
    enabled: true
    skip_if_version_exists: true
    name: Codex Proxy RS
    summary: 面向 Codex 的自托管多账号 AI 网关
